services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dori
      POSTGRES_PASSWORD: dori
      POSTGRES_DB: doriishonch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dori"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dori:dori@db:5432/doriishonch
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  bot:
    build: ./bot
    env_file: .env
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]
    profiles: [bot]

volumes:
  pgdata:
